name: features_tour
description: Features Tour is a package that enables you to easily create tours
  to introduce your widget features in your app with order.
version: 0.7.0-rc.6
homepage: https://github.com/lamnhan066/features_tour

screenshots:
  - description: "Introduction"
    path: assets/intro.webp
topics:
  - features
  - discovery
  - introduction
  - guide
  - onboarding

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  lite_logger: ^0.3.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^8.0.0
