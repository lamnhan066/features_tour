name: features_tour
description: Features Tour is a package that enables you to easily create tours
  to introduce your widget features in your app with order.
version: 0.8.0
homepage: https://github.com/lamnhan066/features_tour

screenshots:
  - description: "Introduction"
    path: assets/intro.webp
topics:
  - features
  - discovery
  - introduction
  - guide
  - onboarding

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  lite_logger: ^0.3.3
  material_ui: ^1.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
